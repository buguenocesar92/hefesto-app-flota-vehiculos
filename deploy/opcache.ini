; OPcache.
; El código de la aplicación se escribe una vez y se lee miles de veces, así
; que tener bytecode compilado en memoria es la diferencia entre una API que
; responde rápido y una que se arrastra.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; En producción se valida cada tanto: una aplicación que se despliega muchas
; veces al día no necesita recompilar en cada petición.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Con validate_timestamps apagado, reiniciar PHP-FPM es OBLIGATORIO en cada
; despliegue. Sin ese reinicio, el código nuevo no se carga nunca y se sigue
; ejecutando el viejo. Queda anotado en docs/04-INSTALACION.md.