# =============================================================================
# Gestión de Flota de Vehículos · Hefesto Studio
# Compose de PRODUCCIÓN.
#
# Diferencias con el de desarrollo, y por qué cada una importa:
#
#   1. NO se publican puertos de PostgreSQL ni de Redis. En desarrollo
#      escuchan en 127.0.0.1 porque hay que mirarlos; en producción no hay
#      motivo para que estén abiertos a nada.
#   2. `APP_DEBUG=false`. Nunca trazas al cliente.
#   3. TLS y el proxy inverso quedan fuera del compose, y por eso hay un Nginx
#      que termina TLS y reenvía al frontend y a la API.
#   4. El planificador corre en una sola instancia y es un contenedor propio:
#      que la tarea de vencimientos corra dos veces es el peor fallo posible
#      en este sistema.
#
# Ver docs/10-PRUEBAS-Y-ESTADO.md: este archivo NO se levantó nunca. No había
# Docker en el entorno donde se construyó el sistema.
# =============================================================================

name: flota-vehiculos

services:
    postgres:
        image: postgres:16.4-alpine
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_MIGRATION_USERNAME}
            POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?definir DB_MIGRATION_PASSWORD en .env}
            POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=es-CL'
        volumes:
            - postgres_datos:/var/lib/postgresql/data
            - ./respaldos:/respaldos
        # Sin `ports`: la base no se expone. Solo la red interna del compose
        # puede alcanzarla.
        networks:
            - interna
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_MIGRATION_USERNAME} -d ${DB_DATABASE}']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7.2.5-alpine
        restart: always
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD:?definir REDIS_PASSWORD en .env}
            --appendonly yes
        volumes:
            - redis_datos:/data
        networks:
            - interna
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
            interval: 10s
            timeout: 5s
            retries: 5

    api:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.api
        restart: always
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_KEY: ${APP_KEY:?}
            APP_URL: ${APP_URL}
            APP_TIMEZONE: ${APP_TIMEZONE:-America/Santiago}
            APP_LOCALE: ${APP_LOCALE:-es_CL}
            LOG_LEVEL: ${LOG_LEVEL:-info}

            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD en .env}

            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:?}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis

            AUTHENTIK_URL: ${AUTHENTIK_URL}
            AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
            AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
            FLOTA_DOMINIOS_PERMITIDOS: ${FLOTA_DOMINIOS_PERMITIDOS:-}

            FLOTA_ZONA_HORARIA: ${FLOTA_ZONA_HORARIA:-America/Santiago}
            FLOTA_PROGRAMACION_ALERTAS: ${FLOTA_PROGRAMACION_ALERTAS:-0 10 * * *}
            FLOTA_CANDADO_ALERTAS_MINUTOS: ${FLOTA_CANDADO_ALERTAS_MINUTOS:-30}
            FLOTA_ALERTAS_ENVIO_ACTIVO: ${FLOTA_ALERTAS_ENVIO_ACTIVO:-false}
            FLOTA_LITROS_MINIMOS_RENDIMIENTO: ${FLOTA_LITROS_MINIMOS_RENDIMIENTO:-5}

            MAIL_MAILER: ${MAIL_MAILER:-smtp}
            MAIL_HOST: ${MAIL_HOST}
            MAIL_PORT: ${MAIL_PORT:-587}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_ENCRYPTION: tls
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - interna
            - publica

    scheduler:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.api
        restart: always
        command: ['php', 'artisan', 'schedule:work']
        environment:
            APP_ENV: production
            APP_KEY: ${APP_KEY:?}
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD:?}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:?}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            FLOTA_PROGRAMACION_ALERTAS: ${FLOTA_PROGRAMACION_ALERTAS:-0 10 * * *}
            FLOTA_CANDADO_ALERTAS_MINUTOS: ${FLOTA_CANDADO_ALERTAS_MINUTOS:-30}
            FLOTA_ALERTAS_ENVIO_ACTIVO: ${FLOTA_ALERTAS_ENVIO_ACTIVO:-false}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - interna

    worker:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.api
        restart: always
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--backoff=60', '--verbose']
        environment:
            APP_ENV: production
            APP_KEY: ${APP_KEY:?}
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD:?}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: ${REDIS_PASSWORD:?}
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            FLOTA_ALERTAS_ENVIO_ACTIVO: ${FLOTA_ALERTAS_ENVIO_ACTIVO:-false}
            MAIL_MAILER: ${MAIL_MAILER:-smtp}
            MAIL_HOST: ${MAIL_HOST}
            MAIL_PORT: ${MAIL_PORT:-587}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - interna

    web:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.web
        restart: always
        environment:
            NUXT_API_BASE: http://api:8000
            NUXT_PUBLIC_AUTHENTIK_URL: ${NUXT_PUBLIC_AUTHENTIK_URL}
            NUXT_PUBLIC_AUTHENTIK_CLIENT_ID: ${NUXT_PUBLIC_AUTHENTIK_CLIENT_ID}
        depends_on:
            - api
        networks:
            - interna
            - publica

    proxy:
        # Nginx termina TLS y expone lo único que debe estar expuesto.
        #
        # `postgres` y `redis` no están en la red `publica`, así que desde
        # fuera no hay forma de alcanzarlos aunque el contenedor proxy se
        # comprometiera.
        #
        # > PENDIENTE: falta el archivo de configuración de Nginx con el
        # > certificado. Hay que escribirlo y probarlo contra un dominio real.
        image: nginx:1.27.1-alpine
        restart: always
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certificados:/etc/nginx/certificados:ro
        depends_on:
            - web
            - api
        networks:
            - publica

networks:
    # Los servicios que manejan datos se comunican entre sí solo por aquí.
    interna:
        internal: true
    publica:

volumes:
    postgres_datos:
    redis_datos: