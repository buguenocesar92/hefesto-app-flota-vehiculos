; Configuración de PHP para la API de flota de vehículos.
; Fijada en la imagen, no en el sistema: el contenedor es reproducible.

memory_limit = 512M

; El límite de ejecución no se pone alto "por si acaso": un proceso que se
; come la memoria del contenedor deja la tarea programada de alertas sin correr,
; y un aviso que no sale es peor que un error visible.
max_execution_time = 60

; Los errores de PHP no se muestran al navegador: la aplicación los convierte
; en respuestas JSON limpias (ver bootstrap/app.php). display_errors queda en
; Off para que ninguna traza llegue por accidente.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Registro en log con contexto: sin esto, el log de la aplicación no sirve para
; entender por qué una tarea programada no corrió.
log_errors_max_len = 0

; Fecha y hora en la zona del contenedor. El cálculo de vencimientos usa la
; zona horaria de cada flota (columna tenants.zona_horaria), no esta.
date.timezone = America/Santiago

expose_php = Off